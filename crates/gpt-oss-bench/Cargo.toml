[package]
name = "gpt-oss-bench"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
gpt-oss-core.workspace = true
gpt-oss-engine.workspace = true
gpt-oss-tokenizer.workspace = true
gpt-oss-model-runner.workspace = true
gpt-oss-cpu-kernels.workspace = true
gpt-oss-evidence.workspace = true
gpt-oss-xe = { workspace = true, optional = true }
sha2.workspace = true
tokio.workspace = true
metrics-exporter-prometheus.workspace = true
half = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
rand_chacha = { workspace = true, optional = true }
safetensors = { workspace = true, optional = true }

[features]
default = []
xe = [
    "gpt-oss-model-runner/xe",
    "dep:gpt-oss-xe",
    "dep:half",
    "dep:rand",
    "dep:rand_chacha",
    "dep:safetensors",
]
cuda = ["gpt-oss-engine/cuda"]
cublaslt = ["cuda", "gpt-oss-engine/cublaslt"]

[dev-dependencies]
criterion.workspace = true
rand.workspace = true
rand_chacha.workspace = true
rayon.workspace = true

[[bench]]
name = "sampling_bench"
harness = false

[[bin]]
name = "live_cuda_parity"
path = "src/bin/live_cuda_parity.rs"
required-features = ["cuda"]

[[bin]]
name = "restricted_prefill_trace"
path = "src/bin/restricted_prefill_trace.rs"
required-features = ["cuda"]

[[bin]]
name = "restricted_logit_diff"
path = "src/bin/restricted_logit_diff.rs"
required-features = ["cuda"]

[[bin]]
name = "cpu_parity"
path = "src/bin/cpu_parity.rs"

[[bin]]
name = "xe_projection_gate"
path = "src/bin/xe_projection_gate.rs"
required-features = ["xe"]
