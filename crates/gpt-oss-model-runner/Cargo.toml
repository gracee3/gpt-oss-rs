[package]
name = "gpt-oss-model-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
description = "Model execution and forward pass orchestration for the gpt-oss-rs inference engine"
keywords = ["llm", "inference", "model-runner", "forward-pass", "vllm"]
categories = ["science", "hardware-support"]

[features]
default = []
xe = ["dep:gpt-oss-xe"]
cuda = ["gpt-oss-gpu/cuda", "dep:cudarc"]
cublaslt = ["cuda", "gpt-oss-gpu/cublaslt"]
amx-int8 = ["gpt-oss-cpu-kernels/amx-int8"]
# Deterministic lifecycle fault hooks for bounded heterogeneous integration
# tests. This feature is never enabled by a production/runtime feature.
heterogeneous-test-faults = ["cuda"]

[dependencies]
gpt-oss-core.workspace = true
gpt-oss-semantics.workspace = true
gpt-oss-gpu.workspace = true
gpt-oss-moe-semantics.workspace = true
gpt-oss-cpu-kernels = { workspace = true, features = ["linux-fadvise"] }
gpt-oss-xe = { workspace = true, optional = true }
thiserror.workspace = true
half.workspace = true
tracing.workspace = true
bytemuck.workspace = true
memmap2.workspace = true
rand.workspace = true
rand_chacha.workspace = true
rayon.workspace = true
safetensors.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
cudarc = { version = "0.19", features = ["driver", "cublas", "f16", "nccl", "cuda-version-from-build-system"], optional = true }

[dev-dependencies]
tempfile = "3"
