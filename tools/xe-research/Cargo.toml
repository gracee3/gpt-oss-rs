[workspace]
resolver = "2"
members = ["."]

[package]
name = "gpt-oss-xe-research"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
gpt-oss-cpu-kernels = { path = "../../crates/gpt-oss-cpu-kernels" }
half = "2"
libc = "0.2"
memmap2 = "0.9"
rand = "0.8"
rand_chacha = "0.3"
safetensors = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
cc = "1"
