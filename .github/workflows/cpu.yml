name: CPU

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-12
        with:
          components: rustfmt
      - name: CPU parity comparator policy
        run: |
          python3 -m unittest discover -s crates/gpt-oss-bench/tools/tests -p 'test_*.py'
          python3 -m unittest discover -s oracle/tests -p 'test_*.py'
          python3 tools/check_markdown_links.py
      - run: cargo fmt --all --check
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked
      - name: Warnings-denied affected validation crates
        run: cargo clippy -p gpt-oss-evidence -p gpt-oss-bench --all-targets --no-deps --locked -- -D warnings

  kernel-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-12
      - name: Scalar reference path
        run: cargo test -p gpt-oss-cpu-kernels --locked
        env:
          GPT_OSS_CPU_KERNEL: scalar
      - name: AVX2 path
        if: ${{ contains(runner.arch, 'X64') }}
        run: |
          if grep -qw avx2 /proc/cpuinfo && grep -qw fma /proc/cpuinfo; then
            GPT_OSS_CPU_KERNEL=avx2 cargo test -p gpt-oss-cpu-kernels --locked
          fi
      - name: AVX-512 VNNI path
        if: ${{ contains(runner.arch, 'X64') }}
        run: |
          if grep -qw avx2 /proc/cpuinfo \
            && grep -qw avx512f /proc/cpuinfo \
            && grep -qw avx512bw /proc/cpuinfo \
            && grep -qw avx512vl /proc/cpuinfo \
            && grep -Eqw 'avx512vnni|avx512_vnni' /proc/cpuinfo; then
            GPT_OSS_CPU_KERNEL=avx512-vnni cargo test -p gpt-oss-cpu-kernels --locked
          fi

  amx-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-12
        with:
          components: clippy
      - name: Compile propagated AMX feature
        run: cargo check -p gpt-oss-server --features amx-int8 --locked
      - name: Test portable AMX packing and emulation
        run: cargo test -p gpt-oss-cpu-kernels --features amx-int8 --locked
      - name: Lint AMX kernel feature
        run: cargo clippy -p gpt-oss-cpu-kernels --all-targets --features amx-int8 --locked -- -D warnings
