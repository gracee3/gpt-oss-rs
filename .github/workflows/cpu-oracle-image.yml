name: CPU oracle image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE_NAME: ghcr.io/gracee3/gpt-oss-rs-cpu-oracle
  SKOPEO_IMAGE: quay.io/skopeo/stable@sha256:9c68e585103448f7e4abb835132ffe9759d7a962a0fa426035775956e7a1e021

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out selected image inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute immutable discovery tags
        id: identity
        shell: bash
        run: |
          short_sha="${GITHUB_SHA:0:12}"
          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "input_tag=${IMAGE_NAME}:input-${short_sha}" >> "${GITHUB_OUTPUT}"

      - name: Build and publish linux/amd64 oracle
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: oracle/Dockerfile.cpu
          platforms: linux/amd64
          push: true
          pull: true
          tags: |
            ${{ steps.identity.outputs.input_tag }}
            ${{ env.IMAGE_NAME }}:v0.0.9-pytorch-2.12.1-cpu
          build-args: BUILD_INPUT_REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Resolve pushed platform config digest
        id: pushed
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          image_reference="${IMAGE_NAME}@${DIGEST}"
          root_manifest="$(docker buildx imagetools inspect --raw "${image_reference}")"
          platform_digest="$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64" and (.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest") | .digest' <<<"${root_manifest}" | head -n1)"
          test -n "${platform_digest}"
          platform_manifest="$(docker buildx imagetools inspect --raw "${IMAGE_NAME}@${platform_digest}")"
          config_digest="$(jq -r '.config.digest' <<<"${platform_manifest}")"
          test "${config_digest}" != "null"
          echo "image_reference=${image_reference}" >> "${GITHUB_OUTPUT}"
          echo "config_digest=${config_digest}" >> "${GITHUB_OUTPUT}"

      - name: Qualify native and generic probes under the locked policy
        shell: bash
        env:
          IMAGE_REFERENCE: ${{ steps.pushed.outputs.image_reference }}
        run: |
          set -euo pipefail
          docker pull "${IMAGE_REFERENCE}"
          mkdir -p "${RUNNER_TEMP}/oracle-empty-model" "${RUNNER_TEMP}/oracle-attempt"
          common=(
            --rm --read-only --network=none --cap-drop=ALL
            --security-opt=no-new-privileges:true
            --user="$(id -u):$(id -g)"
            --cpuset-cpus=0-3 --cpus=4 --memory=24g --memory-swap=24g
            --pids-limit=1024 --hostname=gpt-oss-cpu-oracle --workdir=/repo
            --env=OMP_NUM_THREADS=4 --env=MKL_NUM_THREADS=4
            --env=PYTHONHASHSEED=0 --env=CUDA_VISIBLE_DEVICES=
            --env=NVIDIA_VISIBLE_DEVICES=void
            --mount="type=bind,src=${RUNNER_TEMP}/oracle-empty-model,dst=/model,readonly"
            --mount="type=bind,src=${GITHUB_WORKSPACE},dst=/repo,readonly"
            --mount="type=bind,src=${RUNNER_TEMP}/oracle-attempt,dst=/attempt"
          )
          docker run "${common[@]}" "${IMAGE_REFERENCE}" --mode native --repetitions 5 > "${RUNNER_TEMP}/probe-native.json"
          docker run "${common[@]}" --env=ATEN_CPU_CAPABILITY=default "${IMAGE_REFERENCE}" --mode generic --repetitions 5 > "${RUNNER_TEMP}/probe-generic.json"
          jq -e '.repeat_identical == true and .repetitions == 5 and .torch.cuda_available == false and .torch.cuda_version == null' "${RUNNER_TEMP}/probe-native.json" "${RUNNER_TEMP}/probe-generic.json"
          test "$(jq -r .host_fingerprint "${RUNNER_TEMP}/probe-native.json")" = "$(jq -r .host_fingerprint "${RUNNER_TEMP}/probe-generic.json")"
          test "$(jq -r .torch.cpu_capability "${RUNNER_TEMP}/probe-generic.json")" = "DEFAULT"
          test "$(docker image inspect --format '{{.Id}}' "${IMAGE_REFERENCE}")" = "${{ steps.pushed.outputs.config_digest }}"

      - name: Generate exact-image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.pushed.outputs.image_reference }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: cpu-oracle.spdx.json
          syft-version: v1.38.0
          upload-artifact: false
          upload-release-assets: false

      - name: Generate registry provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Export the exact pushed digest as OCI archive
        shell: bash
        env:
          IMAGE_REFERENCE: ${{ steps.pushed.outputs.image_reference }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/cpu-oracle-${GITHUB_SHA}.oci.tar"
          docker run --rm \
            --network=host \
            --volume="${HOME}/.docker:/auth:ro" \
            --volume="${RUNNER_TEMP}:/output" \
            "${SKOPEO_IMAGE}" \
            copy --all --preserve-digests --src-authfile=/auth/config.json \
            "docker://${IMAGE_REFERENCE}" "oci-archive:/output/$(basename "${archive}")"
          imported="$(docker run --rm --volume="${RUNNER_TEMP}:/output:ro" "${SKOPEO_IMAGE}" inspect --raw "oci-archive:/output/$(basename "${archive}")" | sha256sum | cut -d' ' -f1)"
          test "sha256:${imported}" = "${EXPECTED_DIGEST}"
          cp "${{ steps.attest.outputs.bundle-path }}" "${RUNNER_TEMP}/cpu-oracle.provenance.json"
          cp cpu-oracle.spdx.json "${RUNNER_TEMP}/cpu-oracle.spdx.json"
          archive_sha="$(sha256sum "${archive}" | cut -d' ' -f1)"
          sbom_sha="$(sha256sum "${RUNNER_TEMP}/cpu-oracle.spdx.json" | cut -d' ' -f1)"
          provenance_sha="$(sha256sum "${RUNNER_TEMP}/cpu-oracle.provenance.json" | cut -d' ' -f1)"
          jq -n \
            --arg image_reference "${IMAGE_REFERENCE}" \
            --arg image_manifest_digest "${EXPECTED_DIGEST}" \
            --arg image_config_digest "${{ steps.pushed.outputs.config_digest }}" \
            --arg image_input_revision "${GITHUB_SHA}" \
            --arg oci_archive_sha256 "${archive_sha}" \
            --arg sbom_sha256 "${sbom_sha}" \
            --arg provenance_sha256 "${provenance_sha}" \
            '{image_reference:$image_reference,image_manifest_digest:$image_manifest_digest,image_config_digest:$image_config_digest,image_input_revision:$image_input_revision,oci_archive_sha256:$oci_archive_sha256,sbom_sha256:$sbom_sha256,provenance_sha256:$provenance_sha256}' \
            > "${RUNNER_TEMP}/oracle-lock-material.json"

      - name: Upload recovery and lock material
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cpu-oracle-${{ steps.identity.outputs.short_sha }}
          path: |
            ${{ runner.temp }}/cpu-oracle-${{ github.sha }}.oci.tar
            ${{ runner.temp }}/cpu-oracle.spdx.json
            ${{ runner.temp }}/cpu-oracle.provenance.json
            ${{ runner.temp }}/oracle-lock-material.json
            ${{ runner.temp }}/probe-native.json
            ${{ runner.temp }}/probe-generic.json
          retention-days: 90
          if-no-files-found: error
